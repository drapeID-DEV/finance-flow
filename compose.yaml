services:
    postgres:
        image: postgres:17
        container_name: finance-flow-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: finance_flow
            POSTGRES_USER: finance_flow
            POSTGRES_PASSWORD: finance_flow_dev
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

    api:
        build: ./server
        container_name: finance-flow-api
        restart: unless-stopped
        env_file:
            - ./server/.env
        environment:
            DATABASE_URL: postgresql+asyncpg://finance_flow:finance_flow_dev@postgres:5432/finance_flow
            NBU_BASE_URL: https://bank.gov.ua/NBUStatService/v1
        ports:
            - '8000:8000'
        depends_on:
            - postgres

volumes:
    postgres_data:
